<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotazione punti</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6b66;
    --line: #dcdcd6; --accent: #0b6bcb; --error: #b3261e; --marker: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #20201e; --text: #ecece8; --muted: #a0a09a;
      --line: #3a3a36; --accent: #6db3f2; --error: #f2877f; --marker: #ff6b61;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  aside { width: 240px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); }
  #progress { padding: 12px; font-weight: 600; border-bottom: 1px solid var(--line); }
  #list { flex: 1; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
  #list button { display: block; width: 100%; padding: 6px 12px; border: 0; background: none; color: inherit; font: inherit; font-size: 12px; text-align: left; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #list button:hover { background: var(--line); }
  #list button[aria-current="true"] { background: var(--accent); color: #fff; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px; min-height: 58px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #prompt { font-size: 18px; font-weight: 600; }
  #message { color: var(--muted); }
  #message.error { color: var(--error); font-weight: 600; }
  #retry, #controls button { padding: 6px 12px; font: inherit; cursor: pointer; }
  #controls { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
  #progress small { display: block; font-weight: 400; color: var(--muted); }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; overflow: hidden; }
  #frame { position: relative; display: inline-block; line-height: 0; }
  #photo { display: block; max-width: calc(100vw - 264px); max-height: calc(100vh - 130px); cursor: crosshair; user-select: none; }
  .marker { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2px solid #fff; border-radius: 50%; background: var(--marker); color: #fff; font-size: 12px; line-height: 18px; text-align: center; pointer-events: none; box-shadow: 0 0 2px #000; }
  .points-off .marker { visibility: hidden; }
  .marker.movable { pointer-events: auto; cursor: grab; touch-action: none; }
  .marker.selected { outline: 3px solid var(--accent); outline-offset: 1px; }
  #points { margin: 0; padding: 8px 12px; list-style: none; border-bottom: 1px solid var(--line); }
  #points button { width: 100%; padding: 4px 8px; margin-bottom: 4px; font: inherit; text-align: left; cursor: pointer; }
  #points button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  [hidden] { display: none !important; }
  @media (max-width: 700px) {
    body { flex-direction: column; }
    aside { width: 100%; height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
    #photo { max-width: calc(100vw - 24px); max-height: calc(70vh - 180px); }
  }
</style>
</head>
<body>
<aside>
  <div id="progress"></div>
  <ol id="points" hidden></ol>
  <ul id="list"></ul>
</aside>
<main>
  <header>
    <div id="prompt" aria-live="polite"></div>
    <div id="message" aria-live="polite"></div>
    <button id="retry" type="button" hidden>Riprova a salvare</button>
    <div id="controls">
      <button id="confirm" type="button" hidden>Conferma (Invio)</button>
      <button id="undo" type="button">Annulla</button>
      <button id="hide-point" type="button">Punto non visibile</button>
      <button id="skip" type="button">Salta</button>
      <button id="reject" type="button">Non adatta</button>
      <button id="restore" type="button" hidden>Ripristina</button>
      <button id="resume-skipped" type="button" hidden>Riprendi le saltate</button>
    </div>
  </header>
  <div id="stage">
    <div id="frame" hidden>
      <img id="photo" alt="Immagine da annotare" draggable="false">
    </div>
  </div>
</main>
<script>
"use strict";

const SYMBOLS = { pending: "[ ]", annotated: "[x]", skipped: "[~]", rejected: "[-]", unreadable: "[!]" };
// Long enough to stop a second press of Enter from confirming an image nobody has looked at.
const CONFIRM_DELAY_MS = 300;
// Below this, a press on a point is a selection and not a move.
const DRAG_THRESHOLD_PX = 3;
const ARROW_STEPS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

const elements = {
  progress: document.getElementById("progress"),
  list: document.getElementById("list"),
  points: document.getElementById("points"),
  prompt: document.getElementById("prompt"),
  message: document.getElementById("message"),
  retry: document.getElementById("retry"),
  confirm: document.getElementById("confirm"),
  undo: document.getElementById("undo"),
  hidePoint: document.getElementById("hide-point"),
  skip: document.getElementById("skip"),
  reject: document.getElementById("reject"),
  restore: document.getElementById("restore"),
  resumeSkipped: document.getElementById("resume-skipped"),
  frame: document.getElementById("frame"),
  photo: document.getElementById("photo"),
};

const state = {
  points: [],
  images: [],
  currentId: null,
  placed: [],
  reviewPoints: null,
  reviewHistory: [],
  selectedPoint: null,
  loadingPoints: false,
  shownAt: null,
  saving: false,
  retryAction: null,
};

function countOf(status) {
  return state.images.filter((image) => image.status === status).length;
}

function imageById(id) {
  return state.images.find((image) => image.image_id === id);
}

function imageUrl(id) {
  return `/images/${encodeURIComponent(id)}`;
}

function annotationUrl(id) {
  return `/api/images/${encodeURIComponent(id)}/annotation`;
}

function proposalUrl(id) {
  return `/api/images/${encodeURIComponent(id)}/proposal`;
}

function nextPending() {
  const candidates = state.images.filter((image) => image.status === "pending" && image.image_id !== state.currentId);
  return candidates.find((image) => image.has_proposal) || candidates[0];
}

function setMessage(text, isError = false) {
  elements.message.textContent = text;
  elements.message.classList.toggle("error", isError);
}

function renderProgress() {
  const annotated = countOf("annotated");
  const rejected = countOf("rejected");
  const detail = document.createElement("small");
  detail.textContent = `${annotated} annotate, ${rejected} scartate, ${countOf("skipped")} saltate`;
  const proposed = state.images.filter((image) => image.status === "pending" && image.has_proposal).length;
  const todo = document.createElement("small");
  todo.textContent = `Da fare: ${proposed} con proposta, ${countOf("pending") - proposed} senza`;
  elements.progress.textContent = `Immagini: ${annotated + rejected} di ${state.images.length} completate`;
  elements.progress.append(detail, todo);
}

function renderControls() {
  const current = imageById(state.currentId);
  const rejected = current?.status === "rejected";
  for (const button of [elements.undo, elements.hidePoint, elements.skip, elements.reject]) {
    button.hidden = !current || rejected || (state.loadingPoints && (button === elements.undo || button === elements.hidePoint));
    button.disabled = state.saving;
  }
  if (state.reviewPoints && state.selectedPoint === null) elements.hidePoint.disabled = true;
  elements.confirm.hidden = !state.reviewPoints;
  elements.confirm.disabled = state.saving;
  elements.restore.hidden = !rejected;
  elements.restore.disabled = state.saving;
  elements.resumeSkipped.hidden = Boolean(current) || countOf("skipped") === 0;
}

function renderList() {
  elements.list.replaceChildren(...state.images.map((image) => {
    const item = document.createElement("li");
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.id = image.image_id;
    button.textContent = `${SYMBOLS[image.status] || ""} ${image.image_id}`;
    button.setAttribute("aria-current", String(image.image_id === state.currentId));
    button.addEventListener("click", () => {
      if (!state.saving) openImage(image.image_id);
    });
    item.append(button);
    return item;
  }));
}

function updateRow(id) {
  const button = elements.list.querySelector(`button[data-id="${CSS.escape(id)}"]`);
  if (button) button.textContent = `${SYMBOLS[imageById(id).status] || ""} ${id}`;
}

function markCurrentRow() {
  for (const button of elements.list.querySelectorAll('button[aria-current="true"]')) {
    button.setAttribute("aria-current", "false");
  }
  const button = elements.list.querySelector(`button[data-id="${CSS.escape(state.currentId)}"]`);
  if (button) {
    button.setAttribute("aria-current", "true");
    button.scrollIntoView({ block: "nearest" });
  }
}

function renderMarkers() {
  for (const marker of elements.frame.querySelectorAll(".marker")) marker.remove();
  const points = state.reviewPoints || state.placed;
  points.forEach((point, index) => {
    if (!point.visible) return;
    const marker = document.createElement("div");
    marker.className = "marker";
    marker.dataset.index = String(index);
    placeMarker(marker, point);
    marker.textContent = String(index + 1);
    marker.classList.toggle("selected", index === state.selectedPoint);
    // With a point selected, clicks must reach the photo even on top of a marker: nearby points are the usual case.
    if (state.reviewPoints && state.selectedPoint === null) makeMovable(marker, index);
    elements.frame.append(marker);
  });
}

function placeMarker(marker, point) {
  marker.style.left = `${point.x * 100}%`;
  marker.style.top = `${point.y * 100}%`;
}

function positionOf(event) {
  const box = elements.photo.getBoundingClientRect();
  return { x: (event.clientX - box.left) / box.width, y: (event.clientY - box.top) / box.height };
}

function clamped(value) {
  return Math.min(Math.max(value, 0), 1);
}

function rememberReview() {
  state.reviewHistory.push(structuredClone(state.reviewPoints));
}

function makeMovable(marker, index) {
  marker.classList.add("movable");
  let start = null;
  let moved = false;
  marker.addEventListener("pointerdown", (event) => {
    if (state.saving) return;
    event.preventDefault();
    marker.setPointerCapture(event.pointerId);
    start = { x: event.clientX, y: event.clientY };
    moved = false;
  });
  marker.addEventListener("pointermove", (event) => {
    if (!start) return;
    if (!moved && Math.hypot(event.clientX - start.x, event.clientY - start.y) < DRAG_THRESHOLD_PX) return;
    if (!moved) rememberReview();
    moved = true;
    const { x, y } = positionOf(event);
    Object.assign(state.reviewPoints[index], { x: clamped(x), y: clamped(y) });
    placeMarker(marker, state.reviewPoints[index]);
  });
  marker.addEventListener("pointerup", () => {
    if (!start) return;
    start = null;
    if (moved) {
      state.selectedPoint = null;
      afterReviewChange();
    } else {
      selectPoint(index);
    }
  });
}

function selectPoint(index) {
  state.selectedPoint = state.selectedPoint === index ? null : index;
  renderMarkers();
  renderPointList();
  renderControls();
}

function renderPointList() {
  elements.points.hidden = !state.reviewPoints;
  if (!state.reviewPoints) return;
  elements.points.replaceChildren(...state.reviewPoints.map((point, index) => {
    const item = document.createElement("li");
    const button = document.createElement("button");
    button.type = "button";
    const hiddenNote = point.visible ? "" : " (non visibile)";
    button.textContent = `${index + 1} ${state.points[index].label}${hiddenNote}`;
    button.setAttribute("aria-pressed", String(index === state.selectedPoint));
    button.addEventListener("click", () => selectPoint(index));
    item.append(button);
    return item;
  }));
}

function showNoVisiblePoints() {
  elements.prompt.textContent = "Nessun punto visibile";
  setMessage("Usa Non adatta per scartare l'immagine, oppure Annulla.", true);
}

function afterReviewChange() {
  elements.retry.hidden = true;
  setMessage("");
  renderPrompt();
  renderMarkers();
  renderPointList();
  renderControls();
  if (!state.reviewPoints.some((point) => point.visible)) showNoVisiblePoints();
}

function renderPrompt() {
  const total = state.points.length;
  const number = state.placed.length;
  if (imageById(state.currentId)?.status === "rejected") {
    elements.prompt.textContent = "Immagine scartata";
  } else if (state.loadingPoints) {
    elements.prompt.textContent = "Caricamento dei punti...";
  } else if (state.reviewPoints) {
    elements.prompt.textContent = "Controlla i punti e conferma";
  } else if (number < total) {
    elements.prompt.textContent = `Punto ${number + 1} di ${total}: ${state.points[number].label}`;
  } else {
    elements.prompt.textContent = "Salvataggio...";
  }
}

function showNoCurrentImage(text, hint) {
  state.currentId = null;
  state.reviewPoints = null;
  elements.frame.hidden = true;
  elements.prompt.textContent = text;
  setMessage(hint);
  renderControls();
}

function showFinished() {
  showNoCurrentImage(
    "Nessun'altra immagine da annotare.",
    `Saltate rimaste: ${countOf("skipped")}. Illeggibili: ${countOf("unreadable")}.`,
  );
}

function preloadNext() {
  const next = nextPending();
  if (next) new Image().src = imageUrl(next.image_id);
}

function noteIfShown() {
  if (state.reviewPoints && elements.photo.complete && state.shownAt === null) {
    state.shownAt = performance.now();
  }
}

async function loadReviewPoints(id, annotated) {
  try {
    const response = await fetch(annotated ? annotationUrl(id) : proposalUrl(id));
    if (!response.ok) throw new Error(`errore ${response.status}`);
    const data = await response.json();
    if (state.currentId !== id) return;
    state.reviewPoints = annotated ? data.annotation?.points ?? null : data.proposal;
    if (!annotated) {
      imageById(id).has_proposal = Boolean(data.proposal);
    } else if (state.reviewPoints) {
      setMessage("Immagine già salvata: sposta i punti e conferma.");
    }
  } catch (error) {
    if (state.currentId !== id) return;
    setMessage(`Punti non disponibili (${error.message}): segnali a mano.`);
  }
  state.loadingPoints = false;
  noteIfShown();
  renderProgress();
  renderPrompt();
  renderMarkers();
  renderPointList();
  renderControls();
}

async function openImage(id) {
  const image = imageById(id);
  const annotated = image.status === "annotated";
  const usesProposal = image.has_proposal && (image.status === "pending" || image.status === "skipped");
  state.currentId = id;
  state.placed = [];
  state.reviewPoints = null;
  state.reviewHistory = [];
  state.selectedPoint = null;
  state.shownAt = null;
  state.loadingPoints = annotated || usesProposal;
  // Every image opens with its points showing, so none is confirmed without being seen.
  elements.frame.classList.remove("points-off");
  elements.retry.hidden = true;
  setMessage("");
  markCurrentRow();
  renderPrompt();
  renderMarkers();
  renderPointList();
  renderControls();
  elements.frame.hidden = false;
  elements.photo.src = imageUrl(id);
  preloadNext();

  if (annotated || usesProposal) await loadReviewPoints(id, annotated);
}

function openNext() {
  const next = nextPending();
  if (next) {
    openImage(next.image_id);
  } else {
    showFinished();
  }
}

async function store(body, afterSaved, retry = () => store(body, afterSaved)) {
  const id = state.currentId;
  state.saving = true;
  state.retryAction = retry;
  elements.retry.hidden = true;
  setMessage("");
  renderControls();
  try {
    const response = await fetch(annotationUrl(id), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!response.ok) throw new Error(`errore ${response.status}`);
  } catch (error) {
    elements.prompt.textContent = "Non salvato";
    setMessage(`Salvataggio non riuscito (${error.message}). L'immagine resta aperta.`, true);
    elements.retry.hidden = false;
    return;
  } finally {
    state.saving = false;
    renderControls();
  }
  imageById(id).status = body.status;
  updateRow(id);
  renderProgress();
  afterSaved(id);
}

function afterPointChange() {
  renderMarkers();
  renderPrompt();
  if (state.placed.length < state.points.length) return;
  if (state.placed.some((point) => point.visible)) {
    store({ status: "annotated", points: state.placed }, openNext);
  } else {
    showNoVisiblePoints();
  }
}

function canPlacePoint() {
  // Until the next image loads, the browser keeps showing the previous one.
  return !state.saving
    && !state.reviewPoints
    && !state.loadingPoints
    && elements.photo.complete
    && state.placed.length < state.points.length
    && imageById(state.currentId)?.status !== "rejected";
}

function moveSelectedPoint(x, y) {
  if (state.saving || state.selectedPoint === null || !elements.photo.complete) return;
  rememberReview();
  const name = state.reviewPoints[state.selectedPoint].name;
  state.reviewPoints[state.selectedPoint] = { name, x, y, visible: true };
  state.selectedPoint = null;
  afterReviewChange();
}

elements.photo.addEventListener("click", (event) => {
  const { x, y } = positionOf(event);
  if (x < 0 || x > 1 || y < 0 || y > 1) return;
  if (state.reviewPoints) {
    moveSelectedPoint(x, y);
    return;
  }
  if (!canPlacePoint()) return;
  state.placed.push({ name: state.points[state.placed.length].name, x, y, visible: true });
  afterPointChange();
});

function hideSelectedPoint() {
  rememberReview();
  const name = state.reviewPoints[state.selectedPoint].name;
  state.reviewPoints[state.selectedPoint] = { name, visible: false };
  state.selectedPoint = null;
  afterReviewChange();
}

elements.hidePoint.addEventListener("click", () => {
  if (state.reviewPoints) {
    if (!state.saving && state.selectedPoint !== null) hideSelectedPoint();
    return;
  }
  if (!canPlacePoint()) return;
  state.placed.push({ name: state.points[state.placed.length].name, visible: false });
  afterPointChange();
});

elements.undo.addEventListener("click", () => {
  if (state.reviewPoints) {
    if (state.saving || state.reviewHistory.length === 0) return;
    state.reviewPoints = state.reviewHistory.pop();
    state.selectedPoint = null;
    afterReviewChange();
    return;
  }
  if (state.saving || state.placed.length === 0) return;
  state.placed.pop();
  elements.retry.hidden = true;
  setMessage("");
  renderMarkers();
  renderPrompt();
});

function confirmReview() {
  const shownLongEnough = state.shownAt !== null && performance.now() - state.shownAt >= CONFIRM_DELAY_MS;
  if (state.saving || !state.reviewPoints || !elements.photo.complete || !shownLongEnough) return;
  if (!state.reviewPoints.some((point) => point.visible)) return;
  store({ status: "annotated", points: state.reviewPoints }, openNext, confirmReview);
}

elements.confirm.addEventListener("click", confirmReview);

// Enter must never activate a focused button: the one just used would fire on the next image.
document.addEventListener("keydown", (event) => {
  if (event.key !== "Enter") return;
  event.preventDefault();
  if (!event.repeat) confirmReview();
});

document.addEventListener("keydown", (event) => {
  if (event.key.toLowerCase() !== "s" || event.repeat || event.metaKey || event.ctrlKey || event.altKey) return;
  elements.frame.classList.toggle("points-off");
});

function nudgeSelectedPoint([stepX, stepY], repeat) {
  const point = state.reviewPoints[state.selectedPoint];
  if (!point?.visible) return;
  // A held key is one change, so Annulla does not have to step back through every repeat.
  if (!repeat) rememberReview();
  const box = elements.photo.getBoundingClientRect();
  point.x = clamped(point.x + stepX / box.width);
  point.y = clamped(point.y + stepY / box.height);
  afterReviewChange();
}

document.addEventListener("keydown", (event) => {
  if (!state.reviewPoints || state.saving || !elements.photo.complete) return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const number = Number(event.key);
  if (ARROW_STEPS[event.key]) {
    event.preventDefault();
    if (state.selectedPoint !== null) nudgeSelectedPoint(ARROW_STEPS[event.key], event.repeat);
  } else if (event.repeat) {
    return;
  } else if (event.key === "Backspace" || event.key === "Delete") {
    if (state.reviewPoints[state.selectedPoint]?.visible) hideSelectedPoint();
  } else if (number >= 1 && number <= state.reviewPoints.length) {
    selectPoint(number - 1);
  }
});

elements.photo.addEventListener("load", noteIfShown);

elements.skip.addEventListener("click", () => store({ status: "skipped" }, openNext));
elements.reject.addEventListener("click", () => store({ status: "rejected" }, openNext));
elements.restore.addEventListener("click", () => store({ status: "pending" }, openImage));

elements.resumeSkipped.addEventListener("click", () => {
  const skipped = state.images.find((image) => image.status === "skipped");
  if (skipped) openImage(skipped.image_id);
});

elements.photo.addEventListener("error", () => {
  const image = imageById(state.currentId);
  if (!image) return;
  image.status = "unreadable";
  updateRow(image.image_id);
  renderProgress();
  openNext();
});

elements.retry.addEventListener("click", () => state.retryAction());

async function start() {
  const response = await fetch("/api/state");
  const data = await response.json();
  state.points = data.points;
  state.images = data.images;
  renderList();
  renderProgress();
  if (state.images.length === 0) {
    showNoCurrentImage(
      "Nessuna immagine da annotare.",
      "Raccogli le immagini con: .venv/bin/python -m dataset_tools.collect",
    );
    return;
  }
  openNext();
}

start().catch((error) => {
  showNoCurrentImage("Impossibile caricare le immagini.", error.message);
  setMessage(`Impossibile caricare le immagini: ${error.message}`, true);
});
</script>
</body>
</html>
